.t{display:block;padding:1px 0}.t input{margin-right:6px}

button.off{background:#fff}#hide{position:absolute;right:6px;top:6px;margin:0;padding:3px 8px}
#info{position:fixed;right:12px;top:12px;width:230px;background:#212830ee;border:2px solid #fff;padding:8px 12px;display:none}
#sec{position:fixed;left:324px;right:12px;bottom:12px;height:230px;background:#fff;border:2px solid #16191d;display:none}
#sec canvas{width:100%;height:100%;display:block}#secx{position:absolute;right:4px;top:4px;margin:0}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#ffe600;color:#16191d;padding:6px 12px;font-weight:700;display:none}
#open{position:fixed;left:12px;top:12px;display:none;margin:0}
.leg{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
