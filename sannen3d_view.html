<script>
const D=/*DATA*/null;
window.SN={D};
const $=id=>document.getElementById(id);
const cv=$("gl"),gl=cv.getContext("webgl2",{antialias:true});
$("ttl").textContent=D.name;$("k").value=D.K;
if(!gl){$("hint").style.display="block";$("hint").textContent="Trình duyệt không hỗ trợ WebGL2"}
const VS=`#version 300 es
in vec3 p;in vec3 c;uniform mat4 M;uniform float E,Z0;out vec3 vc;out vec3 vp;
void main(){vec3 q=vec3(p.x,p.y,(p.z-Z0)*E);vp=q;vc=c;gl_Position=M*vec4(q,1.);}`;
const FS=`#version 300 es
precision highp float;in vec3 vc;in vec3 vp;uniform float L;uniform float A;out vec4 o;
void main(){vec3 n=normalize(cross(dFdx(vp),dFdy(vp)));float d=abs(dot(n,normalize(vec3(.35,.45,.82))));
o=vec4(vc*(L>.5?.42+.58*d:1.),A);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const U=n=>gl.getUniformLocation(pr,n),uM=U("M"),uE=U("E"),uZ=U("Z0"),uL=U("L"),uA=U("A"),aP=gl.getAttribLocation(pr,"p"),aC=gl.getAttribLocation(pr,"c");
function mesh(pos,col,mode,dyn){const a=gl.createVertexArray();gl.bindVertexArray(a);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,pos,dyn?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,3,gl.FLOAT,false,0,0);
const c=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,c);gl.bufferData(gl.ARRAY_BUFFER,col,dyn?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);gl.enableVertexAttribArray(aC);gl.vertexAttribPointer(aC,3,gl.FLOAT,false,0,0);return{a,b,c,n:pos.length/3,mode}}
function expand(v,t,rgb){const p=new Float32Array(t.length*3),c=new Float32Array(t.length*3);for(let i=0;i<t.length;i++){const k=t[i]*3;p.set([v[k],v[k+1],v[k+2]],i*3);c.set(rgb,i*3)}return[p,c]}
const site=D.site,N=site.own.length;
let zmin=1e9,zmax=-1e9;for(const z of site.zg){if(z<zmin)zmin=z;if(z>zmax)zmax=z}for(const z of site.zd){if(z<zmin)zmin=z;if(z>zmax)zmax=z}
const Z0=(zmin+zmax)/2;
let gnd=null;
const P=new Float32Array(N*9),C=new Float32Array(N*9);
for(let i=0;i<N*3;i++){P[i*3]=site.xy[i*2];P[i*3+1]=site.xy[i*2+1]}
const dm=mesh(P,C,gl.TRIANGLES,true);
function lines(polys,rgb,zf){const a=[];for(const q of polys){const n=q.length/2;for(let i=0;i<n-1;i++){a.push(q[i*2],q[i*2+1],zf,q[i*2+2],q[i*2+3],zf)}}const c=new Float32Array(a.length);for(let i=0;i<a.length;i+=3)c.set(rgb,i);return[new Float32Array(a),c]}
const zcell=D.cells.length;
function gridSeg(){const a=[];for(const q of D.grid)for(let i=0;i<q.length/2;i++){const j=(i+1)%(q.length/2);a.push(q[i*2],q[i*2+1],0,q[j*2],q[j*2+1],0)}return new Float32Array(a)}
const gs=gridSeg(),gl1=mesh(gs,new Float32Array(gs.length).fill(.9),gl.LINES,true);
const bp=[];for(const q of D.bd)for(let i=0;i<q.length/2-1;i++)bp.push(q[i*2],q[i*2+1],0,q[i*2+2],q[i*2+3],0);
const bf=new Float32Array(bp),bc=new Float32Array(bf.length);for(let i=0;i<bc.length;i+=3)bc.set([1,.9,0],i);const bm=mesh(bf,bc,gl.LINES,true);
const tal=D.taluy?mesh(...expand(D.taluy.v,D.taluy.t,[.8,.58,.24]),gl.TRIANGLES):null;
if(!D.taluy)$("lt0").style.display="none";if(!D.pits.length&&!D.piles.length)$("lp0").style.display="none";
const pits=D.pits.map(q=>{const n=q.v.length/3,top=Math.max(...q.v.filter((_,i)=>i%3==2)),t=[];for(let i=0;i<q.t.length;i+=3){const a=q.t.slice(i,i+3);if(a.every(k=>Math.abs(q.v[k*3+2]-top)<1e-6))continue;t.push(...a)}return mesh(...expand(q.v,t,[.25,.5,.85]),gl.TRIANGLES)});
let plm=null;if(D.piles.length){const a=[];for(const q of D.piles)a.push(q[0],q[1],q[2],q[0],q[1],q[2]-q[4]);const f=new Float32Array(a),c=new Float32Array(f.length).fill(.85);plm=mesh(f,c,gl.LINES)}
let secl=null;
// -- khối: nền sau san, khối đắp, khối đào, vách quanh ranh
const ord=new Int32Array(N*3);const bE=[];{const em=new Map();for(let i=0;i<N;i++){const k=i*6,x=site.xy,a2=(x[k+2]-x[k])*(x[k+5]-x[k+1])-(x[k+4]-x[k])*(x[k+3]-x[k+1]);const o=a2>=0?[0,1,2]:[0,2,1];ord.set(o,i*3);
for(let j=0;j<3;j++){const p=i*3+o[j],q=i*3+o[(j+1)%3],kp=x[p*2].toFixed(3)+","+x[p*2+1].toFixed(3),kq=x[q*2].toFixed(3)+","+x[q*2+1].toFixed(3),key=kp<kq?kp+"|"+kq:kq+"|"+kp;em.set(key,em.has(key)?null:[p,q])}}
for(const v of em.values())if(v)bE.push(v)}
let zgmin=1e9,zdmin=1e9;for(let i=0;i<N*3;i++){zgmin=Math.min(zgmin,site.zg[i]);zdmin=Math.min(zdmin,site.zd[i])}
const ZB=Math.floor(Math.min(zgmin,zdmin-3)-2);
const CN=[.62,.62,.62];
// màu theo bề dày: mỏng thì nhạt, dày thì đậm; thang lấy theo 95% bề dày lớn nhất của từng loại
const LF=[.80,.92,.80],DF=[.05,.40,.16],LC=[.98,.82,.80],DC=[.55,.05,.10];
const HS=(()=>{const f=[],c=[];for(let i=0;i<N*3;i++){const h=site.zd[i]-site.zg[i];if(h>1e-6)f.push(h);else if(h<-1e-6)c.push(-h)}
const q=a=>{if(!a.length)return 1;a.sort((x,y)=>x-y);return Math.max(a[Math.floor(a.length*.95)],.05)};return[q(f),q(c)]})();
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const colF=h=>mix(LF,DF,Math.min(Math.max(h,0)/HS[0],1)),colC=h=>mix(LC,DC,Math.min(Math.max(-h,0)/HS[1],1));
const CF=colF(HS[0]),CC=colC(-HS[1]);
let xpl=0;const SB={pos:[],col:[]},LB=[];
function liftZ(){return xpl?span*.16/Ez:0}
function buildSolid(d){const P2=[],C2=[],Ls=[],lf=liftZ();
const put=(p,c)=>{P2.push(p[0],p[1],p[2]);C2.push(c[0],c[1],c[2])};
const fan=(poly,zf,c,rev)=>{const C=typeof c=="function"?c:()=>c;for(let k=1;k<poly.length-1;k++){const a=poly[0],b=poly[k],e=poly[k+1];if(rev){put([a[0],a[1],zf(a)],C(a));put([e[0],e[1],zf(e)],C(e));put([b[0],b[1],zf(b)],C(b))}else{put([a[0],a[1],zf(a)],C(a));put([b[0],b[1],zf(b)],C(b));put([e[0],e[1],zf(e)],C(e))}}};
const quad=(a,b,za0,zb0,za1,zb1,c,cb)=>{cb=cb||c;put([a[0],a[1],za0],c);put([b[0],b[1],zb0],cb);put([b[0],b[1],zb1],cb);put([a[0],a[1],za0],c);put([b[0],b[1],zb1],cb);put([a[0],a[1],za1],c)};
const V=i=>{const g=site.zg[i],z=site.zd[i]+d;return[site.xy[i*2],site.xy[i*2+1],g,z,z-g]};
const cut=(a,b)=>{const t=a[4]/(a[4]-b[4]);return a.map((v,k)=>k==4?0:v+t*(b[k]-v))};
const showB=$("ld").checked,showN=$("ln").checked;
for(let i=0;i<N;i++){const v=[0,1,2].map(j=>V(i*3+ord[i*3+j]));const pos=[],neg=[];
for(let j=0;j<3;j++){const a=v[j],b=v[(j+1)%3];(a[4]>=0?pos:neg).push(a);if(a[4]*b[4]<0){const q=cut(a,b);pos.push(q);neg.push(q)}}
if(showB){if(pos.length>2&&pos.some(q=>q[4]>1e-6)){fan(pos,q=>q[3]+lf,q=>colF(q[4]),0);fan(pos,q=>q[2]+lf,q=>colF(q[4]),1)}
if(neg.length>2&&neg.some(q=>q[4]<-1e-6)){fan(neg,q=>q[2]+lf,q=>colC(q[4]),0);fan(neg,q=>q[3]+lf,q=>colC(q[4]),1)}}
if(showN&&(xpl||!showB))for(const p of[pos,neg])if(p.length>2)fan(p,q=>Math.min(q[2],q[3]),CN,0)}
for(const[pi,qi]of bE){let a=V(pi),b=V(qi);const segs=a[4]*b[4]<0?[[a,cut(a,b)],[cut(a,b),b]]:[[a,b]];
for(const[p,q]of segs){const s=(p[4]+q[4])>=0,mp=Math.min(p[2],p[3]),mq=Math.min(q[2],q[3]),Mp=Math.max(p[2],p[3]),Mq=Math.max(q[2],q[3]);
if(showN){quad(p,q,ZB,ZB,mp,mq,CN);Ls.push(p[0],p[1],ZB,q[0],q[1],ZB)}
if(showB){quad(p,q,mp+lf,mq+lf,Mp+lf,Mq+lf,s?colF(p[4]):colC(p[4]),s?colF(q[4]):colC(q[4]));Ls.push(p[0],p[1],Mp+lf,q[0],q[1],Mq+lf)}else if(showN)Ls.push(p[0],p[1],mp,q[0],q[1],mq);
if(xpl&&showN&&showB)Ls.push(p[0],p[1],mp,q[0],q[1],mq)}}
return[new Float32Array(P2),new Float32Array(C2),new Float32Array(Ls)]}
let sol=null,sedge=null;
function rebuild(){const[p,c,l]=buildSolid(off);sol=mesh(p,c,gl.TRIANGLES);const lc=new Float32Array(l.length).fill(.09);sedge=mesh(l,lc,gl.LINES)}
// -- hình học khối lượng
const volTri=(function(){return function(a,h){const pos=[h[0]>0,h[1]>0,h[2]>0],np=pos[0]+pos[1]+pos[2];let vf=0,vc=0;const m=(h[0]+h[1]+h[2])/3;if(np==3)return[a*m,0];if(np==0)return[0,-a*m];
let o;if(np==1)o=pos[0]?0:pos[1]?1:2;else o=!pos[0]?0:!pos[1]?1:2;const h0=h[o],h1=h[(o+1)%3],h2=h[(o+2)%3],fr=h0/(h0-h1)*h0/(h0-h2),vs=a*fr*h0/3,vo=a*m-vs;return h0>0?[vs,-vo]:[vo,-vs]}})();
const area=new Float64Array(N);for(let i=0;i<N;i++){const k=i*6,x=site.xy;area[i]=.5*Math.abs((x[k+2]-x[k])*(x[k+5]-x[k+1])-(x[k+4]-x[k])*(x[k+3]-x[k+1]))}
function stats(d){let f=0,c=0;const h=[0,0,0];for(let i=0;i<N;i++){for(let j=0;j<3;j++){let v=site.zd[i*3+j]+d-site.zg[i*3+j];h[j]=Math.abs(v)<1e-9?1e-9:v}const r=volTri(area[i],h);f+=r[0];c+=r[1]}return[f,c]}
SN.stats=stats;
let off=0,Ez=5,kK=D.K;
function fmt(v){return v.toLocaleString("vi-VN",{maximumFractionDigits:1})}
function refresh(){const d=off;for(let i=0;i<N*3;i++){const zd=site.zd[i]+d,h=zd-site.zg[i];P[i*3+2]=zd;const t=Math.min(Math.abs(h)/1.5,1);
if(h>=0){C[i*3]=.93-.81*t;C[i*3+1]=.93-.45*t;C[i*3+2]=.75-.53*t}else{C[i*3]=.93-.23*t;C[i*3+1]=.87-.72*t;C[i*3+2]=.72-.52*t}}
rebuild();
const zAt=(x,y)=>{const a=heightD(x,y),b=heightG(x,y);return a==null?null:Math.max(a,b)+liftZ()};for(let i=0;i<gs.length;i+=3)gs[i+2]=(zAt(gs[i],gs[i+1])??Z0)+.03;gl.bindBuffer(gl.ARRAY_BUFFER,gl1.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,gs);
for(let i=0;i<bf.length;i+=3)bf[i+2]=(zAt(bf[i],bf[i+1])??Z0)+.05;gl.bindBuffer(gl.ARRAY_BUFFER,bm.b);gl.bufferSubData(gl.ARRAY_BUFFER,0,bf);
const [f,c]=stats(d),e=d===0?D.extra:{tf:0,tc:0,pit:D.extra.pit,pile:D.extra.pile};$("vf").textContent=fmt(f)+" m³";$("vc").textContent=fmt(c)+" m³";
const ex=e.tc+e.pit+e.pile-kK*e.tf;$("ex").textContent=fmt(e.tc+e.pit+e.pile)+" / "+fmt(e.tf);$("exl").textContent=d===0?"Đào / đắp ngoài ranh":"Hố móng, cọc";
const s=c+e.tc+e.pit+e.pile-kK*(f+e.tf);$("sur").textContent=(s>0?"+":"")+fmt(s)+" m³";
$("lvl").textContent=D.flat?(D.levelBase+d).toFixed(2)+" m":(d>=0?"+":"")+d.toFixed(2)+" m";$("exv").textContent="× "+Ez;draw()}
// tra cao độ thiết kế theo lưới chia nhóm
const bx={};const B=8;function bk(x,y){return Math.floor(x/B)+"_"+Math.floor(y/B)}
for(let i=0;i<N;i++){const k=i*6,xs=[site.xy[k],site.xy[k+2],site.xy[k+4]],ys=[site.xy[k+1],site.xy[k+3],site.xy[k+5]];
for(let a=Math.floor(Math.min(...xs)/B);a<=Math.floor(Math.max(...xs)/B);a++)for(let b=Math.floor(Math.min(...ys)/B);b<=Math.floor(Math.max(...ys)/B);b++){(bx[a+"_"+b]=bx[a+"_"+b]||[]).push(i)}}
function bary(i,x,y){const k=i*6,s=site.xy,x1=s[k],y1=s[k+1],x2=s[k+2],y2=s[k+3],x3=s[k+4],y3=s[k+5],d=(y2-y3)*(x1-x3)+(x3-x2)*(y1-y3);if(Math.abs(d)<1e-12)return null;const a=((y2-y3)*(x-x3)+(x3-x2)*(y-y3))/d,b=((y3-y1)*(x-x3)+(x1-x3)*(y-y3))/d,c=1-a-b;return a>-1e-4&&b>-1e-4&&c>-1e-4?[a,b,c]:null}
function find(x,y){for(const i of bx[bk(x,y)]||[]){const w=bary(i,x,y);if(w)return[i,w]}return null}
function heightD(x,y){const r=find(x,y);if(!r)return null;const[i,w]=r;return w[0]*site.zd[i*3]+w[1]*site.zd[i*3+1]+w[2]*site.zd[i*3+2]+off}
function heightG(x,y){const r=find(x,y);if(!r)return null;const[i,w]=r;return w[0]*site.zg[i*3]+w[1]*site.zg[i*3+1]+w[2]*site.zg[i*3+2]}
// -- camera
let xmin=1e9,xmax=-1e9,ymin=1e9,ymax=-1e9;for(let i=0;i<site.xy.length;i+=2){const x=site.xy[i],y=site.xy[i+1];if(x<xmin)xmin=x;if(x>xmax)xmax=x;if(y<ymin)ymin=y;if(y>ymax)ymax=y}
const span=Math.hypot(xmax-xmin,ymax-ymin);const home={th:-1.25,ph:.62,r:span*1.12,c:[(xmin+xmax)/2,(ymin+ymax)/2,0]};
